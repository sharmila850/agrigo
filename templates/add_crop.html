<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Crop | AgriGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🌾 AgriGo
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/farmer_dashboard">
                Dashboard
            </a>

            <a href="/matches">
                🤝 Matches
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- ================= ADD CROP ================= -->

    <main class="form-page">

        <div class="form-container">

            <!-- Heading -->

            <div class="form-header">

                <div class="form-icon">
                    🌱
                </div>

                <p class="dashboard-label">
                    FARMER PORTAL
                </p>

                <h1>
                    List Your Crop
                </h1>

                <p>
                    Add your crop details so suitable buyers
                    can discover your listing.
                </p>

            </div>


            <!-- Form -->

            <form method="POST"
                  action="/add_crop"
                  class="agri-form">


                <!-- Crop Name -->

                <div class="form-group">

                    <label for="crop_name">
                        Crop Name
                    </label>

                    <input
                        type="text"
                        id="crop_name"
                        name="crop_name"
                        placeholder="Example: Tomato"
                        required>

                </div>


                <!-- Quantity -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="quantity">
                            Available Quantity (kg)
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            placeholder="Example: 500"
                            min="1"
                            step="0.01"
                            required>

                    </div>


                    <!-- Quality -->

                    <div class="form-group">

                        <label for="quality">
                            Quality
                        </label>

                        <select
                            id="quality"
                            name="quality"
                            required>

                            <option value="">
                                Select quality
                            </option>

                            <option value="Grade A">
                                Grade A
                            </option>

                            <option value="Grade B">
                                Grade B
                            </option>

                            <option value="Grade C">
                                Grade C
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Expected Price -->

                <div class="form-group">

                    <label for="expected_price">
                        Expected Price (₹/kg)
                    </label>

                    <input
                        type="number"
                        id="expected_price"
                        name="expected_price"
                        placeholder="Example: 30"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label for="location">
                        Farm / Crop Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: Chennai"
                        required>

                </div>


                <!-- Dates -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="harvest_date">
                            Harvest Date
                        </label>

                        <input
                            type="date"
                            id="harvest_date"
                            name="harvest_date"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="available_date">
                            Available From
                        </label>

                        <input
                            type="date"
                            id="available_date"
                            name="available_date"
                            required>

                    </div>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="form-submit">

                    🌱 List Crop

                </button>


                <!-- Back -->

                <a href="/farmer_dashboard"
                   class="form-back">

                    ← Back to Dashboard

                </a>

            </form>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 AgriConnect. Connecting farmers directly with buyers.
        </p>

    </footer>

</body>

</html>
