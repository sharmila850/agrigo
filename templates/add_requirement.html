<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Requirement | AgriGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🌾 AgriGo
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/buyer_dashboard">
                Dashboard
            </a>

            <a href="/matches">
                🤝 Matches
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- ================= FORM PAGE ================= -->

    <main class="form-page">

        <div class="form-container">

            <!-- Header -->

            <div class="form-header">

                <div class="form-icon">
                    📝
                </div>

                <p class="dashboard-label">
                    BUYER PORTAL
                </p>

                <h1>
                    Add Your Requirement
                </h1>

                <p>
                    Tell farmers what you need and let
                    AgriConnect find suitable crop listings.
                </p>

            </div>


            <!-- Form -->

            <form method="POST"
                  action="/add_requirement"
                  class="agri-form">


                <!-- Crop -->

                <div class="form-group">

                    <label for="crop_name">
                        Crop Name
                    </label>

                    <input
                        type="text"
                        id="crop_name"
                        name="crop_name"
                        placeholder="Example: Tomato"
                        required>

                </div>


                <!-- Quantity + Quality -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="quantity">
                            Required Quantity (kg)
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            placeholder="Example: 500"
                            min="1"
                            step="0.01"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="quality">
                            Required Quality
                        </label>

                        <select
                            id="quality"
                            name="quality"
                            required>

                            <option value="">
                                Select quality
                            </option>

                            <option value="Grade A">
                                Grade A
                            </option>

                            <option value="Grade B">
                                Grade B
                            </option>

                            <option value="Grade C">
                                Grade C
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Maximum Price -->

                <div class="form-group">

                    <label for="max_price">
                        Maximum Price (₹/kg)
                    </label>

                    <input
                        type="number"
                        id="max_price"
                        name="max_price"
                        placeholder="Example: 30"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label for="location">
                        Preferred Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: Chennai"
                        required>

                </div>


                <!-- Required Date -->

                <div class="form-group">

                    <label for="required_date">
                        Required Date
                    </label>

                    <input
                        type="date"
                        id="required_date"
                        name="required_date"
                        required>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="form-submit">

                    📝 Submit Requirement

                </button>


                <!-- Back -->

                <a href="/buyer_dashboard"
                   class="form-back">

                    ← Back to Dashboard

                </a>

            </form>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 AgriGo. Connecting farmers directly with buyers.
        </p>

    </footer>

</body>

</html>
